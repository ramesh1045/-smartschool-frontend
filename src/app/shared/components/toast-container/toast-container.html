<div class="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="app-toast" [class]="'app-toast--' + toast.variant" role="alert">
      <i class="bi" [class]="iconFor(toast.variant)"></i>
      <span class="flex-grow-1">{{ toast.text }}</span>
      <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="toastService.dismiss(toast.id)"></button>
    </div>
  }
</div>
