<aside class="app-sidebar d-flex flex-column">
  <div class="brand d-flex align-items-center gap-2 px-3 py-3">
    <i class="bi bi-journal-bookmark-fill brand-icon"></i>
    <span class="brand-label">{{ brandLabel }}</span>
  </div>

  <nav class="flex-grow-1 px-2">
    <ul class="nav nav-pills flex-column gap-1">
      @for (item of navItems(); track item.route) {
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center gap-2"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route.split('/').length <= 2 }"
          >
            <i class="bi" [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar-footer px-3 py-3">
    <span class="text-secondary small">Replacing the paper diary, one class at a time.</span>
  </div>
</aside>
